<div style="background:var(--card-bg);color:var(--text-main);width:90%;max-width:560px;border-radius:1.5rem;overflow:hidden;position:relative;display:flex;flex-direction:column;max-height:85vh;box-shadow:0 20px 40px rgba(0,0,0,0.15);margin:auto;font-family:'Assistant',sans-serif;">

    <span class="close-modal" onclick="document.getElementById('roadmapModal').style.display='none'" style="position:absolute;top:1rem;left:1rem;z-index:10;font-size:1.4rem;cursor:pointer;color:#94a3b8;line-height:1;">&times;</span>

    <div style="padding:2rem 2rem 1.25rem;text-align:center;border-bottom:1px solid var(--border-color);">
        <div style="display:flex;justify-content:center;margin-bottom:0.35rem;">
            <h2 style="margin:0;font-size:1.25rem;font-weight:800;color:var(--text-main);">מפת הדרכים שלנו</h2>
        </div>
        <p style="margin:0;font-size:0.85rem;color:#64748b;text-align:center;">הצצה לעתיד של בית המדרש - מה עשינו ומה עוד בדרך.</p>

        <div style="display:flex;gap:0.5rem;background:var(--bg,#f1f5f9);border-radius:0.75rem;padding:0.3rem;margin-top:1rem;">
            <button class="roadmap-tab" onclick="setRoadmapFilter('בוצע', this)" style="flex:1;padding:0.5rem 0.75rem;border-radius:0.5rem;border:none;font-size:0.8rem;font-weight:700;cursor:pointer;transition:all 0.2s;background:transparent;color:#64748b;font-family:'Assistant',sans-serif;">בוצע</button>
            <button class="roadmap-tab" onclick="setRoadmapFilter('בטיפול', this)" style="flex:1;padding:0.5rem 0.75rem;border-radius:0.5rem;border:none;font-size:0.8rem;font-weight:700;cursor:pointer;transition:all 0.2s;background:transparent;color:#64748b;font-family:'Assistant',sans-serif;">בטיפול</button>
            <button class="roadmap-tab" onclick="setRoadmapFilter('בתכנון', this)" style="flex:1;padding:0.5rem 0.75rem;border-radius:0.5rem;border:none;font-size:0.8rem;font-weight:700;cursor:pointer;transition:all 0.2s;background:transparent;color:#64748b;font-family:'Assistant',sans-serif;">בתכנון</button>
        </div>
    </div>

    <div id="roadmap-list-area" style="padding:1.25rem;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:0.75rem;">
        <div style="text-align:center;padding:2rem;color:#94a3b8;">טוען...</div>
    </div>
</div>
