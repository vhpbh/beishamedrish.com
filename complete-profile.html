<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>השלמת פרופיל | בית המדרש</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Secular+One&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="api.js"></script>
    <script src="utils.js"></script>
    <script src="auth.js"></script>
    <script src="ui-logic.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Assistant', sans-serif;
            background-color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            direction: rtl;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.18);
            border: 1px solid rgba(255,255,255,0.5);
            width: 100%;
            max-width: 440px;
            padding: 2.5rem 2rem;
            animation: cardIn 0.4s cubic-bezier(0.16,1,0.3,1) both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(24px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .card-header img {
            height: 64px;
            margin: 0 auto 1rem;
            display: block;
        }

        .card-header h1 {
            font-family: 'Secular One', sans-serif;
            font-size: 1.6rem;
            color: #0f172a;
            margin-bottom: 0.35rem;
        }

        .card-header p {
            font-size: 0.9rem;
            color: #64748b;
            line-height: 1.5;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #e2e8f0, transparent);
            margin: 1.5rem 0;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: 0.4rem;
            letter-spacing: 0.01em;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 0.75rem;
            font-family: 'Assistant', sans-serif;
            font-size: 0.95rem;
            color: #0f172a;
            background: #f8fafc;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            outline: none;
            direction: rtl;
        }

        .form-group input:focus {
            border-color: #ca8a04;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(202,138,4,0.12);
        }

        .form-group input::placeholder {
            color: #94a3b8;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .btn-submit {
            width: 100%;
            padding: 0.9rem 1rem;
            margin-top: 0.5rem;
            background: linear-gradient(135deg, #ca8a04 0%, #d97706 100%);
            color: #fff;
            font-family: 'Assistant', sans-serif;
            font-size: 1rem;
            font-weight: 800;
            border: none;
            border-radius: 0.875rem;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
            box-shadow: 0 4px 14px rgba(202,138,4,0.35);
            letter-spacing: 0.01em;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(202,138,4,0.45);
        }

        .btn-submit:active {
            transform: translateY(0);
            opacity: 0.92;
        }

        .footer-note {
            text-align: center;
            margin-top: 1.25rem;
            font-size: 0.78rem;
            color: #94a3b8;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            pointer-events: none;
        }

        /* Alert modal */
        #customAlertModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 99999;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        #customAlertModal > div {
            background: #fff;
            border-radius: 1.5rem;
            padding: 2rem;
            max-width: 320px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            animation: cardIn 0.3s cubic-bezier(0.16,1,0.3,1) both;
        }
        #customAlertModal h3 {
            margin-bottom: 0.75rem;
            font-size: 1.1rem;
            font-weight: 700;
            color: #1e293b;
        }
        #cAlertMsg {
            margin-bottom: 1.5rem;
            color: #475569;
            line-height: 1.6;
        }
        #cAlertBtn {
            background: #ca8a04;
            color: #fff;
            border: none;
            border-radius: 0.75rem;
            padding: 0.75rem 2rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            font-family: 'Assistant', sans-serif;
        }

        @media (max-width: 480px) {
            .card { padding: 2rem 1.25rem; }
            .grid-2 { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="card-header">
            <img src="logo-remove.png" alt="בית המדרש">
            <h1>כמעט סיימנו!</h1>
            <p>נא להשלים כמה פרטים כדי להמשיך לבית המדרש</p>
        </div>

        <div class="divider"></div>

        <form onsubmit="handleCompleteProfile(event)">
            <div class="form-group">
                <label for="compFullName">שם מלא</label>
                <input type="text" id="compFullName" placeholder="ישראל ישראלי" required>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="compAge">גיל</label>
                    <input type="number" id="compAge" placeholder="25" min="10" max="120" required>
                </div>
                <div class="form-group">
                    <label for="compPhone">טלפון</label>
                    <input type="tel" id="compPhone" placeholder="050-0000000" required>
                </div>
            </div>

            <div class="form-group">
                <label for="compAddress">כתובת מגורים</label>
                <input type="text" id="compAddress" placeholder="תל אביב" required>
            </div>

            <button type="submit" class="btn-submit">סיום והתחברות</button>
        </form>

        <p class="footer-note">הפרטים ישמשו לצורך התאמת חברותא ושיתוף פעולה בלימוד</p>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <div id="customAlertModal" onclick="if(event.target===this)this.style.display='none'">
        <div>
            <h3>הודעה</h3>
            <p id="cAlertMsg"></p>
            <button id="cAlertBtn" onclick="document.getElementById('customAlertModal').style.display='none'">אישור</button>
        </div>
    </div>

    <script>
        window.onload = async () => {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (user && user.user_metadata && user.user_metadata.full_name) {
                document.getElementById('compFullName').value = user.user_metadata.full_name;
            }
        };
    </script>
</body>

</html>
